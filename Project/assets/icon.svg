<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Groundwork home screen icon: a person pressing a barbell overhead on
       solid ground. Source for the PNGs in public/; regenerate with
       `node scripts/build-icons.mjs`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4658d8"/>
      <stop offset="1" stop-color="#3344c0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g id="mark">
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <!-- ground -->
      <path d="M150 428 H362" stroke-opacity="0.45" stroke-width="18"/>
      <!-- bar -->
      <path d="M112 130 H400" stroke-width="14"/>
      <!-- arms: shoulders up to the bar -->
      <path d="M228 250 L186 190 L178 132 M284 250 L326 190 L334 132" stroke-width="24"/>
      <!-- torso -->
      <path d="M256 250 V322" stroke-width="54"/>
      <!-- legs -->
      <path d="M240 330 L206 408 M272 330 L306 408" stroke-width="30"/>
    </g>
    <!-- head -->
    <circle cx="256" cy="196" r="32" fill="#ffffff"/>
    <!-- plates -->
    <g fill="#ffd166">
      <rect x="120" y="80" width="26" height="100" rx="8"/>
      <rect x="92" y="94" width="22" height="72" rx="7"/>
      <rect x="366" y="80" width="26" height="100" rx="8"/>
      <rect x="398" y="94" width="22" height="72" rx="7"/>
    </g>
  </g>
</svg>
